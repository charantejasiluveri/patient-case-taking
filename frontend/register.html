<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Mediease</title>
    <meta name="description" content="Register as a patient on Mediease.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <!-- Sidebar -->
        <div class="auth-sidebar">
            <h1>MEDIEASE</h1>
            <p>Join our platform to experience seamless and AI-powered case taking before you meet your doctor.</p>
        </div>

        <!-- Registration Form Content -->
        <div class="auth-content">
            <div class="auth-card" style="max-width: 600px;">
                <div class="auth-card-header">
                    <h2>Patient Registration</h2>
                    <p>Create your account to get started.</p>
                </div>

                <!-- Alert Message Container -->
                <div id="register-alert" class="alert"></div>

                <form id="register-form">
                    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                        <div class="form-group" style="flex: 1; min-width: 250px;">
                            <label for="fullname">Full Name *</label>
                            <input type="text" id="fullname" class="form-control" required placeholder="John Doe">
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 250px;">
                            <label for="dob">Date of Birth *</label>
                            <input type="date" id="dob" class="form-control" required>
                        </div>
                    </div>

                    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                        <div class="form-group" style="flex: 1; min-width: 250px;">
                            <label for="gender">Gender *</label>
                            <select id="gender" class="form-control" required>
                                <option value="" disabled selected>Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 250px;">
                            <label for="mobile">Mobile Number *</label>
                            <input type="tel" id="mobile" class="form-control" required placeholder="Enter mobile number">
                        </div>
                    </div>

                    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                        <div class="form-group" style="flex: 1; min-width: 250px;">
                            <label for="email">Email (Optional)</label>
                            <input type="email" id="email" class="form-control" placeholder="Email address">
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 250px;">
                            <label for="abha">ABHA ID (Optional)</label>
                            <input type="text" id="abha" class="form-control" placeholder="14-digit ABHA ID">
                        </div>
                    </div>

                    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                        <div class="form-group" style="flex: 1; min-width: 250px;">
                            <label for="reg-password">Password *</label>
                            <input type="password" id="reg-password" class="form-control" required placeholder="Create password">
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 250px;">
                            <label for="confirm-password">Confirm Password *</label>
                            <input type="password" id="confirm-password" class="form-control" required placeholder="Confirm password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary mt-4">Create Account</button>
                    
                    <div class="text-center mt-4" style="font-size: 0.95rem;">
                        <span style="color: var(--text-secondary);">Already have an account?</span> 
                        <a href="index.html" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">Login here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
