<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mediease</title>
    <meta name="description" content="Login to Mediease, the AI-Powered Patient Case-Taking Platform.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <!-- Sidebar -->
        <div class="auth-sidebar">
            <h1>MEDIEASE</h1>
            <p>AI-Powered Patient Case-Taking Platform</p>
        </div>

        <!-- Login Form Content -->
        <div class="auth-content">
            <div class="auth-card">
                <div class="auth-card-header">
                    <h2>Welcome Back</h2>
                    <p>Sign in to continue to Mediease</p>
                </div>

                <!-- Alert Message Container -->
                <div id="login-alert" class="alert"></div>

                <form id="login-form">
                    <div style="margin-bottom: 25px; text-align: center;">
                        <label style="display: block; margin-bottom: 15px; font-weight: 600; color: var(--text-secondary);">I am a:</label>
                        <div style="display: flex; gap: 15px; justify-content: center;">
                            <button type="button" class="role-btn active" id="btn-role-patient" onclick="selectRole('patient')">
                                👤 Patient
                            </button>
                            <button type="button" class="role-btn" id="btn-role-doctor" onclick="selectRole('doctor')">
                                🩺 Doctor
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label id="username-label" for="username">Username / Patient ID / Mobile Number</label>
                        <input type="text" id="username" class="form-control" required placeholder="Enter your credential">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" required placeholder="Enter your password">
                    </div>

                    <button type="submit" class="btn btn-primary">Login</button>
                    
                    <div class="auth-links">
                        <a href="register.html" id="register-link">Register as Patient</a>
                        <a href="#">Forgot Password?</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <style>
        .role-btn {
            flex: 1;
            padding: 12px 15px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .role-btn:hover {
            background: #f8fafc;
        }
        .role-btn.active {
            border-color: var(--primary-color);
            background: #eff6ff;
            color: var(--primary-color);
        }
    </style>

    <script>
        function selectRole(role) {
            // Update UI State
            document.getElementById('btn-role-patient').classList.remove('active');
            document.getElementById('btn-role-doctor').classList.remove('active');
            document.getElementById(`btn-role-${role}`).classList.add('active');

            // Update Labels and Links
            const usernameLabel = document.getElementById('username-label');
            const registerLink = document.getElementById('register-link');
            const usernameInput = document.getElementById('username');

            if (role === 'doctor') {
                usernameLabel.textContent = 'Doctor ID / Username';
                usernameInput.placeholder = 'Enter your Doctor ID or Username';
                registerLink.textContent = 'Register as Doctor';
                registerLink.href = 'register-doctor.html';
            } else {
                usernameLabel.textContent = 'Username / Patient ID / Mobile Number';
                usernameInput.placeholder = 'Enter your credential';
                registerLink.textContent = 'Register as Patient';
                registerLink.href = 'register.html';
            }
        }
    </script>
    </div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
